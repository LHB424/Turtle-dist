<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="TURTLE PIPELINE 사용 안내서">
<title>TURTLE PIPELINE 시작하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="appstyle">
:root {
  --paper:      #F3F3F4;
  --surface:    #FFFFFF;
  --surface-2:  #EAEAEC;
  --line:       #DCDCDE;
  --line-soft:  #E8E8EA;
  --ink:        #141416;
  --ink-2:      #47474C;
  --ink-3:      #77777D;

  --jade:       #0F6E4E;
  --jade-soft:  #E2F0E9;
  --ochre:      #6E6E72;
  --ochre-soft: #EDEDEF;
  --rust:       #A33A28;
  --rust-soft:  #F6E3DD;

  --measure: 66ch;
  --fs-display: clamp(2.3rem, 6vw, 3.5rem);
  --fs-h2: clamp(1.45rem, 3.4vw, 1.95rem);
  --fs-h3: 1.12rem;
  --fs-body: 1.0625rem;
  --fs-small: 0.875rem;
  --fs-micro: 0.75rem;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #0F0F11;
    --surface:    #17171A;
    --surface-2:  #202024;
    --line:       #2E2E33;
    --line-soft:  #26262A;
    --ink:        #E8E8EA;
    --ink-2:      #ADADB4;
    --ink-3:      #86868D;
    --jade:       #4FCB94;
    --jade-soft:  #123026;
    --ochre:      #8B8B90;
    --ochre-soft: #232327;
    --rust:       #E08A72;
  --rust-soft:  #33201B;
    --rust-soft:  #33201B;
  }
}
:root[data-theme="dark"] {
  --paper:      #0F0F11;
  --surface:    #17171A;
  --surface-2:  #202024;
  --line:       #2E2E33;
  --line-soft:  #26262A;
  --ink:        #E8E8EA;
  --ink-2:      #ADADB4;
  --ink-3:      #86868D;
  --jade:       #4FCB94;
  --jade-soft:  #123026;
  --ochre:      #8B8B90;
  --ochre-soft: #232327;
  --rust:       #E08A72;
}

* { box-sizing: border-box; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: "IBM Plex Sans KR", "Malgun Gothic", system-ui, sans-serif;
  font-size: var(--fs-body);
  font-weight: 300;
  line-height: 1.8;
  margin: 0;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: break-word;
}

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 clamp(1.15rem, 4vw, 3rem) 7rem; }

/* 표지 */
.cover { padding: clamp(3rem, 9vw, 6.5rem) 0 clamp(2rem, 5vw, 3.5rem); border-bottom: 1px solid var(--line); position: relative; }

/* 표지 첫 줄 — 눈썹줄 · 제품 마크 · 작성자가 한 줄에 선다 */
.eyerow {
  display: flex; align-items: center; flex-wrap: wrap;
  gap: 0.4rem clamp(0.7rem, 2vw, 1.2rem);
  margin: 0 0 clamp(0.8rem, 2vw, 1.4rem);
}
.byline {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: var(--fs-micro); letter-spacing: 0.06em; color: var(--ink-3);
  white-space: nowrap; margin: 0 0 0 auto;
}
/* 제품 마크 — SHELL 의 등껍질 마크(shell_main.ShellMark)와 같은 도형 */
.mark {
  width: clamp(52px, 8vw, 76px); height: clamp(52px, 8vw, 76px);
  flex: 0 0 auto; pointer-events: none;
}
.mark svg { width: 100%; height: 100%; display: block; }
.mark .mo { stroke: var(--jade); stroke-width: 1.6; }
.mark .mi, .mark .ms { stroke: var(--jade); stroke-width: 1.2; opacity: 0.45; }
.eyebrow {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: var(--fs-micro); letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--jade); margin: 0; display: flex; align-items: center; gap: 0.7rem;
  flex: 0 1 auto;
}
.eyebrow::after { content: ""; height: 1px; background: var(--line); width: clamp(2rem, 10vw, 8rem); flex: 0 0 auto; }
h1 {
  font-family: "Gowun Batang", "Batang", serif; font-weight: 700;
  font-size: var(--fs-display); line-height: 1.2; letter-spacing: -0.01em;
  margin: 0 0 1.2rem; text-wrap: balance;
}
.lede { font-size: clamp(1.05rem, 2.2vw, 1.24rem); color: var(--ink-2); max-width: 46ch; margin: 0 0 2.4rem; line-height: 1.75; }
.cover-meta {
  display: flex; flex-wrap: wrap; gap: 0.6rem 1.6rem;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: var(--fs-micro); letter-spacing: 0.06em; color: var(--ink-3); text-transform: uppercase;
}

/* 30초 요약 */
.quickstart { margin: clamp(2.5rem, 6vw, 4rem) 0 0; }
.quickstart h2 { font-size: var(--fs-h3); margin: 0 0 1.5rem; font-family: inherit; font-weight: 600; }
.steps {
  list-style: none; padding: 0; margin: 0; max-width: none;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 3px; overflow: hidden;
}
.steps li { background: var(--surface); padding: 1.4rem 1.3rem 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; margin: 0; position: relative; }
.steps .n { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: var(--fs-micro); font-weight: 600; color: var(--jade); letter-spacing: 0.1em; }
.steps .st { font-weight: 600; font-size: 1rem; }
.steps .sd { color: var(--ink-2); font-size: var(--fs-small); line-height: 1.65; }
.quickfoot { margin-top: 1.2rem; color: var(--ink-2); font-size: var(--fs-small); }

/* 레이아웃 */
.layout { display: grid; grid-template-columns: 1fr; gap: 2rem; margin-top: clamp(3rem, 7vw, 5rem); }
@media (min-width: 940px) {
  .layout { grid-template-columns: 190px minmax(0, 1fr); gap: clamp(2.5rem, 5vw, 4.5rem); align-items: start; }
}
nav.toc { position: sticky; top: 1.5rem; font-size: var(--fs-small); }
nav.toc .toc-title {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: var(--fs-micro);
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
  margin-bottom: 0.9rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--line);
}
nav.toc ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.1rem; max-width: none; }
nav.toc li { margin: 0; }
nav.toc a {
  display: flex; gap: 0.6rem; color: var(--ink-2); text-decoration: none;
  padding: 0.28rem 0 0.28rem 0.7rem; border-left: 2px solid transparent;
  margin-left: -0.7rem; transition: color .15s, border-color .15s; line-height: 1.45;
}
nav.toc a .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: var(--fs-micro); color: var(--ink-3); padding-top: 0.15rem; }
nav.toc a:hover { color: var(--ink); }
nav.toc a.on { color: var(--jade); border-left-color: var(--jade); font-weight: 500; }
nav.toc a.on .num { color: var(--jade); }
nav.toc a:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
@media (max-width: 620px) { .eyebrow::after { display: none; } }

@media (max-width: 939px) {
  nav.toc { position: static; border: 1px solid var(--line); border-radius: 3px; padding: 1rem 1.1rem; background: var(--surface); }
}

/* 본문 */
main { min-width: 0; }
section.chapter { padding-top: clamp(2.5rem, 6vw, 4rem); scroll-margin-top: 1.5rem; position: relative; }
section.chapter + section.chapter { border-top: 1px solid var(--line-soft); }
.chapter-num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: var(--fs-micro); letter-spacing: 0.14em; color: var(--ink-3); display: block; margin-bottom: 0.7rem; }
h2 {
  font-family: "Gowun Batang", "Batang", serif; font-weight: 700; font-size: var(--fs-h2);
  line-height: 1.32; margin: 0 0 1.4rem; text-wrap: balance; letter-spacing: -0.005em;
}
h3 { font-size: var(--fs-h3); font-weight: 600; margin: 2.4rem 0 0.8rem; line-height: 1.5; }
p { max-width: var(--measure); margin: 0 0 1.1rem; }
strong { font-weight: 600; color: var(--ink); }
a { color: var(--jade); }
ul, ol { max-width: var(--measure); padding-left: 1.2rem; margin: 0 0 1.2rem; }
li { margin-bottom: 0.45rem; }
li::marker { color: var(--ink-3); }
code, .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.9em; }
p code, li code, td code, .what code { background: var(--surface-2); padding: 0.1em 0.4em; border-radius: 2px; }
.c-wip { color: var(--ochre); font-weight: 500; }
.c-pub { color: var(--jade); font-weight: 500; }
.sample {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 1rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: 3px;
  padding: 0.8rem 1.1rem; display: inline-block; margin: 0 0 1.1rem;
}

/* 표 */
.table-scroll { overflow-x: auto; margin: 0 0 1.6rem; }
table { border-collapse: collapse; width: 100%; min-width: 420px; font-size: var(--fs-small); line-height: 1.6; }
th, td { text-align: left; padding: 0.72rem 0.9rem; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: var(--fs-micro);
  font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
  border-bottom: 1px solid var(--line);
}
tbody tr:last-child td { border-bottom: 1px solid var(--line); }
td:first-child { font-weight: 500; color: var(--ink); }
table.mono-first td:first-child {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 600;
  font-size: 0.82rem; letter-spacing: 0.04em; white-space: nowrap;
}

/* wip / pub */
.duo { display: grid; grid-template-columns: 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; margin: 1.8rem 0; }
@media (min-width: 620px) { .duo { grid-template-columns: 1fr 1fr; } }
.duo > div { background: var(--surface); padding: 1.5rem 1.4rem 1.6rem; border-top: 3px solid var(--line); }
.duo .head { font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 600; font-size: 1.15rem; letter-spacing: 0.04em; margin-bottom: 0.15rem; }
.duo .sub { font-size: var(--fs-small); color: var(--ink-3); margin-bottom: 1.1rem; }
.duo dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0.5rem 1rem; font-size: var(--fs-small); }
.duo dt { color: var(--ink-3); white-space: nowrap; }
.duo dd { margin: 0; }
.duo .wip { border-top-color: var(--ochre); }
.duo .wip .head { color: var(--ochre); }
.duo .pub { border-top-color: var(--jade); }
.duo .pub .head { color: var(--jade); }

.analogy {
  font-family: "Gowun Batang", "Batang", serif; font-size: clamp(1.15rem, 2.6vw, 1.45rem);
  line-height: 1.6; color: var(--ink); max-width: 34ch; margin: 2rem 0;
  padding-left: 1.2rem; border-left: 3px solid var(--jade);
}
.analogy .ln { display: block; }

/* 파일명 해부 */
.anatomy { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: clamp(1.4rem, 4vw, 2.2rem) clamp(1rem, 3vw, 1.8rem); margin: 1.8rem 0; }
.filename { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: clamp(1.05rem, 3.6vw, 1.6rem); font-weight: 500; white-space: nowrap; overflow-x: auto; display: block; padding-bottom: 0.6rem; }
.filename .seg { border-bottom: 3px solid currentColor; padding-bottom: 3px; }
.filename .sc { color: var(--jade); }
.filename .cut { color: var(--ink-2); }
.filename .stg { color: var(--ink); }
.filename .st { color: var(--ochre); }
.filename .ver { color: var(--rust); }
.filename .ext { color: var(--ink-3); }
.filename .sep { color: var(--ink-3); }
.legend { list-style: none; padding: 0; margin: 1.5rem 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 0.9rem 1.4rem; max-width: none; }
.legend li { margin: 0; display: flex; gap: 0.6rem; align-items: flex-start; font-size: var(--fs-small); line-height: 1.5; }
.legend .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; margin-top: 0.45rem; }
.legend .lb { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 600; font-size: 0.82rem; }
.legend .ld { color: var(--ink-2); }

/* 콜아웃 */
.note {
  border-left: 3px solid var(--jade); background: var(--jade-soft);
  padding: 1.1rem 1.3rem; margin: 1.6rem 0; border-radius: 0 3px 3px 0;
  font-size: var(--fs-small); line-height: 1.7; max-width: var(--measure);
}
.note.warn { border-color: var(--rust); background: var(--rust-soft); }
.note p { margin: 0 0 0.6rem; max-width: none; }
.note p:last-child { margin: 0; }
.note .label {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: var(--fs-micro);
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--jade);
  display: block; margin-bottom: 0.4rem; font-weight: 600;
}
.note.warn .label { color: var(--rust); }

/* 하지 말 것 */
.dont { list-style: none; padding: 0; margin: 1.5rem 0; max-width: none; display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.dont li { margin: 0; background: var(--surface); padding: 1rem 1.2rem; display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 0.9rem; position: relative; }
.dont .x { color: var(--rust); font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 600; grid-row: span 2; padding-top: 0.1rem; }
.dont .dt { font-weight: 500; }
.dont .dd { color: var(--ink-2); font-size: var(--fs-small); line-height: 1.6; }

/* 하루 흐름 */
.day { margin: 1.6rem 0; display: flex; flex-direction: column; }
.day .row { display: grid; grid-template-columns: 84px 1fr; gap: 1.2rem; padding: 1.1rem 0; border-top: 1px solid var(--line-soft); position: relative; }
.day .row:last-child { border-bottom: 1px solid var(--line-soft); }
.day .when { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: var(--fs-micro); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); padding-top: 0.25rem; }
.day .what { font-size: var(--fs-small); line-height: 1.7; }

/* FAQ */
.qa { margin: 1.5rem 0; display: flex; flex-direction: column; }
.qa .item { border-top: 1px solid var(--line-soft); padding: 1.2rem 0; position: relative; }
.qa .item:last-child { border-bottom: 1px solid var(--line-soft); }
.qa .q { font-weight: 500; margin: 0 0 0.5rem; display: flex; gap: 0.7rem; }
.qa .mark { color: var(--jade); font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 600; }
.qa .a { color: var(--ink-2); font-size: var(--fs-small); line-height: 1.75; margin: 0; padding-left: 1.6rem; max-width: var(--measure); }

footer { margin-top: 4rem; padding-top: 1.6rem; border-top: 1px solid var(--line); font-size: var(--fs-small); color: var(--ink-3); }
footer .flabel { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: var(--fs-micro); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.3rem; }

/* 세 갈래 입구 */
[hidden] { display: none !important; }
.goto {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 0.6rem; margin: clamp(1.8rem, 4vw, 2.6rem) 0 0;
}
.gcard {
  display: flex; flex-direction: column; gap: 0.25rem;
  padding: 0.95rem 1.1rem; border: 1px solid var(--line); border-radius: 3px;
  background: var(--surface); text-decoration: none; color: var(--ink);
  transition: border-color .12s, transform .12s;
}
a.gcard:hover { border-color: var(--jade); transform: translateY(-1px); }
a.gcard:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
.gcard .gt { font-weight: 600; font-size: 0.98rem; }
a.gcard .gt::after { content: "  →"; color: var(--jade); }
.gcard .gd { font-size: var(--fs-small); color: var(--ink-3); line-height: 1.5; }

/* 부 표시 */
.partmark {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.3rem 0.8rem;
  margin: clamp(3rem, 7vw, 4.5rem) 0 0; padding-top: 1.1rem;
  border-top: 2px solid var(--jade);
}
.partmark .pn {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: var(--fs-micro);
  letter-spacing: 0.14em; color: var(--jade); font-weight: 600;
}
.partmark .pt { font-family: "Gowun Batang", "Batang", serif; font-weight: 700; font-size: 1.25rem; }
.partmark .pd { font-size: var(--fs-small); color: var(--ink-3); }
.partmark + section.chapter { padding-top: 1.6rem; border-top: 0; }

/* 검색 */
.searchbox { position: relative; margin-bottom: 1.1rem; }
.searchbox input {
  width: 100%; box-sizing: border-box; font-family: "IBM Plex Sans KR", system-ui, sans-serif;
  font-size: var(--fs-small); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 2px; padding: 0.45rem 3.2rem 0.45rem 0.6rem;
}
.searchbox input::placeholder { color: var(--ink-3); font-family: "IBM Plex Mono", monospace; font-size: var(--fs-micro); letter-spacing: 0.08em; }
.searchbox input:focus { outline: none; border-color: var(--jade); }
.qres {
  position: absolute; right: 0.55rem; top: 50%; transform: translateY(-50%);
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: var(--fs-micro); color: var(--ink-3);
}
.qres.none { color: var(--rust); }
.tocpart {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: var(--fs-micro);
  letter-spacing: 0.1em; color: var(--jade); font-weight: 600;
  margin: 1rem 0 0.35rem;
}
nav.toc ol + .tocpart { margin-top: 1.2rem; }

/* ===== 편집 모드 ===== */
.tb {
  position: fixed; right: 1rem; bottom: 1rem; z-index: 60;
  display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; justify-content: flex-end;
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
  padding: 0.5rem 0.6rem; box-shadow: 0 6px 24px rgba(0,0,0,.14); max-width: calc(100vw - 2rem);
}
button.tbtn {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.72rem; letter-spacing: 0.06em;
  padding: 0.42rem 0.7rem; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink-2); border-radius: 2px; cursor: pointer; transition: border-color .12s, color .12s;
}
button.tbtn:hover { border-color: var(--jade); color: var(--jade); }
button.tbtn.primary { background: var(--jade); border-color: var(--jade); color: var(--paper); font-weight: 600; }
button.tbtn.primary:hover { color: var(--paper); opacity: .9; }
button.tbtn:focus-visible, .ic button:focus-visible, .bc button:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
.tb .status { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: var(--fs-micro); color: var(--ink-3); padding: 0 0.3rem; }

.hintbar {
  position: fixed; left: 1rem; bottom: 1rem; z-index: 59;
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
  padding: 0.5rem 0.75rem; font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: var(--fs-micro); color: var(--ink-3); line-height: 1.9; max-width: 46vw;
}
.hintbar b { color: var(--ink-2); font-weight: 600; }
@media (max-width: 720px) { .hintbar { display: none; } }

body.editing [data-p] { outline: 1px dashed transparent; outline-offset: 3px; border-radius: 2px; white-space: pre-wrap; }
body.editing [data-p]:hover { outline-color: var(--line); }
body.editing [data-p]:focus { outline: 2px solid var(--jade); outline-offset: 3px; background: var(--surface-2); }
body.editing [data-p]:empty::before { content: "…"; color: var(--ink-3); }
body.editing .filename [data-p] { display: inline-block; min-width: 1ch; }

.ic { display: inline-flex; gap: 2px; margin-left: 0.5rem; opacity: 0; transition: opacity .12s; vertical-align: middle; }
li:hover > .ic, .steps li:hover .ic, tr:hover .ic, .legend li:hover .ic { opacity: 1; }
.dont li .ic, .day .row .ic, .qa .item .ic { position: absolute; right: 0.5rem; top: 0.6rem; margin: 0; }
.dont li:hover .ic, .day .row:hover .ic, .qa .item:hover .ic { opacity: 1; }
.ic button, .bc button {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.68rem; line-height: 1;

<script id="appcode">
(function () {

  var FONTS = '<link rel="preconnect" href="https://fonts.googleapis.com">'

  var DOC = JSON.parse(document.getElementById("appdata").textContent);
  var EDIT = false;

  var CAN_WRITE = true;    // publish 가 not_writer 를 주면 꺼진다

  /* ---------- 값 다루기 ---------- */

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // 아주 작은 서식: **굵게** · `코드` · %%wip:노랑%% · %%pub:초록%% · <br>
  function md(s) {
    return esc(s)
      .replace(/&lt;br&gt;/g, "<br>")
      .replace(/\n/g, "<br>")
      .replace(/%%wip:([^%]*)%%/g, '<span class="c-wip">$1</span>')
      .replace(/%%pub:([^%]*)%%/g, '<span class="c-pub">$1</span>')
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  }

  function key(k) { return /^\d+$/.test(k) ? parseInt(k, 10) : k; }

  function getAt(path) {
    var a = path.split("."), o = DOC;
    for (var i = 0; i < a.length; i++) { o = o[key(a[i])]; }
    return o;
  }
  function setAt(path, v) {
    var a = path.split("."), o = DOC;
    for (var i = 0; i < a.length - 1; i++) { o = o[key(a[i])]; }
    o[key(a[a.length - 1])] = v;
  }

  var KEEP = { t: 1, c: 1, mark: 1, warn: 1, mono: 1, id: 1, color: 1 };
  function blank(v) {
    if (typeof v === "string") { return ""; }
    if (Array.isArray(v)) { return v.map(blank); }
    if (v && typeof v === "object") {
      var o = {};
      for (var k in v) { o[k] = KEEP[k] ? v[k] : blank(v[k]); }
      return o;
    }
    return v;
  }

  /* ---------- 렌더 조각 ---------- */

  function fld(path, val, tag, cls) {
    return "<" + tag + (cls ? ' class="' + cls + '"' : "")

      + ">" + (EDIT ? esc(val) : md(val)) + "</" + tag + ">";
  }

  function ic(arrPath, i) {
    if (!EDIT) { return ""; }
    var b = function (a, t, c) {
      return '<button type="button" class="' + (c || "") + '" data-a="' + a
        + '" data-r="' + arrPath + '" data-i="' + i + '" title="' + t + '">' + t + "</button>";
    };
    return '<span class="ic" contenteditable="false">'
      + b("up", "↑") + b("dn", "↓") + b("add", "＋") + b("del", "×", "danger") + "</span>";
  }

  function bc(arrPath, i) {
    if (!EDIT) { return ""; }
    var b = function (a, t, c) {
      return '<button type="button" class="' + (c || "") + '" data-a="' + a
        + '" data-r="' + arrPath + '" data-i="' + i + '" title="' + t + '">' + t + "</button>";
    };
    return '<div class="bc" contenteditable="false">'
      + b("up", "↑") + b("dn", "↓") + b("del", "×", "danger") + "</div>";
  }

  /* ---------- 블록 ---------- */

  function block(b, p, arrPath, i) {
    var h = "";
    switch (b.t) {
      case "p":
        h = fld(p + ".x", b.x, "p", ""); break;
      case "h3":
        h = fld(p + ".x", b.x, "h3", ""); break;

        h = fld(p + ".x", b.x, "p", "sample"); break;
      case "ul":

        h = "<" + b.t + ">" + b.items.map(function (it, n) {
          return "<li>" + fld(p + ".items." + n, it, "span", "") + ic(p + ".items", n) + "</li>";

      case "note":
        h = '<div class="note' + (b.warn ? " warn" : "") + '">'

      case "table":
        h = '<div class="table-scroll"><table' + (b.mono ? ' class="mono-first"' : "") + "><thead><tr>"
          + b.cols.map(function (c, n) { return "<th>" + (EDIT ? esc(c) : esc(c)) + "</th>"; }).join("")
          + (EDIT ? '<th class="rowctl"></th>' : "")
          + "</tr></thead><tbody>"
          + b.rows.map(function (r, n) {
              return "<tr>" + r.map(function (cell, m) {
                return fld(p + ".rows." + n + "." + m, cell, "td", "");
              }).join("") + (EDIT ? '<td class="rowctl">' + ic(p + ".rows", n) + "</td>" : "") + "</tr>";
            }).join("")
          + "</tbody></table></div>";
        break;
      case "duo":
        h = '<div class="duo">' + ["left", "right"].map(function (side) {
          var d = b[side];
          return '<div class="' + (side === "left" ? "wip" : "pub") + '">'

            + fld(p + "." + side + ".sub", d.sub, "div", "sub")

                return fld(p + "." + side + ".rows." + n + ".0", r[0], "dt", "")

        break;
      case "quote":
        h = '<p class="analogy">' + b.lines.map(function (l, n) {
          return fld(p + ".lines." + n, l, "span", "ln");
        }).join("") + "</p>";
        break;
      case "anatomy":
        h = '<div class="anatomy"><code class="filename">'
          + b.parts.map(function (pt, n) { return fld(p + ".parts." + n + ".x", pt.x, "span", pt.c); }).join("")

          + b.legend.map(function (lg, n) {
              return '<li><span class="dot" style="background:' + lg.color + '"></span><span>'

            }).join("")
          + "</ul></div>";
        break;
      case "day":
        h = '<div class="day">' + b.rows.map(function (r, n) {
          return '<div class="row">'
            + fld(p + ".rows." + n + ".when", r.when, "div", "when")
            + fld(p + ".rows." + n + ".what", r.what, "div", "what")
            + ic(p + ".rows", n) + "</div>";
        }).join("") + "</div>";
        break;
      case "dont":
        h = '<ul class="dont">' + b.items.map(function (it, n) {
          return '<li><span class="x">×</span>'
            + fld(p + ".items." + n + ".x", it.x, "span", "dt")
            + fld(p + ".items." + n + ".d", it.d, "span", "dd")

        break;
      case "qa":
        h = '<div class="qa">' + b.items.map(function (it, n) {
          return '<div class="item"><p class="q"><span class="mark">' + esc(b.mark) + "</span>"
            + fld(p + ".items." + n + ".q", it.q, "span", "") + "</p>"

  }

  /* ---------- 페이지 ---------- */

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  // 등껍질 마크. 꼭짓점은 60도 간격(위가 뾰족한 육각형), 안쪽 반지름은 바깥의 0.46 배 —
  // SHELL 의 ShellMark 와 같은 값이라 두 화면에 같은 그림이 뜬다.
  function mark() {
    var c = 22, ro = 20, ri = ro * 0.46, o = [], n = [], sp = "";
    for (var i = 0; i < 6; i++) {
      var a = (60 * i - 90) * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a);
      var ox = (c + ro * cs).toFixed(2), oy = (c + ro * sn).toFixed(2);
      var ix = (c + ri * cs).toFixed(2), iy = (c + ri * sn).toFixed(2);
      o.push(ox + "," + oy); n.push(ix + "," + iy);
      sp += '<line class="ms" x1="' + ix + '" y1="' + iy + '" x2="' + ox + '" y2="' + oy + '"/>';
    }
    return '<span class="mark" aria-hidden="true">'
      + '<svg viewBox="0 0 44 44" fill="none" stroke-linejoin="round">'
      + '<polygon class="mo" points="' + o.join(" ") + '"/>'
      + '<polygon class="mi" points="' + n.join(" ") + '"/>' + sp
      + "</svg></span>";

  function sections() {
    var lastPart = -1;
    return DOC.sections.map(function (s, n) {
      var p = "sections." + n;
      var pi = s.part || 0, mark = "";
      if (pi !== lastPart) {                      // 부가 바뀌는 자리에 띠를 하나 둔다
        lastPart = pi;
        mark = '<div class="partmark"><span class="pn">' + (pi + 1) + "부</span>"
          + fld("parts." + pi + ".t", parts()[pi].t, "span", "pt")
          + fld("parts." + pi + ".d", parts()[pi].d, "span", "pd") + "</div>";
      }
      return mark + '<section class="chapter" id="' + s.id + '">'
        + bc("sections", n)
        + '<span class="chapter-num">' + pad(n + 1) + "</span>"
        + fld(p + ".title", s.title, "h2", "")
        + s.blocks.map(function (b, m) { return block(b, p + ".blocks." + m, p + ".blocks", m); }).join("")
        + (EDIT ? '<div class="addbar" contenteditable="false"><span class="lbl">블록 추가</span>'
            + ADDABLE.map(function (a) {
                return '<button type="button" class="tbtn" data-a="addblk" data-r="' + p + '.blocks" data-k="' + a[0] + '">＋ ' + a[1] + "</button>";
              }).join("") + "</div>" : "")
        + "</section>";
    }).join("");
  }

  // 꼬리말 — 둘 다 비어 있으면 선까지 통째로 감춘다(편집 중에는 고칠 수 있게 남긴다)
  function footer() {
    var f = DOC.footer || { label: "", text: "" };
    if (!EDIT && !String(f.label).trim() && !String(f.text).trim()) { return ""; }
    return "<footer>" + fld("footer.label", f.label, "p", "flabel")
      + fld("footer.text", f.text, "p", "") + "</footer>";
  }

  function render(keepScroll) {
    var y = window.scrollY;
    document.body.classList.toggle("editing", EDIT);
    document.getElementById("app").innerHTML =
      '<div class="wrap">' + cover() + entrycards() + quick()
      + '<div class="layout">' + toc() + "<main>" + sections()
      + (EDIT ? '<div class="addbar"><span class="lbl">문서</span><button type="button" class="tbtn" data-a="addsec">＋ 새 장 추가</button></div>' : "")
      + footer()
      + "</main></div></div>" + toolbar();
    spy();
    if (keepScroll) { window.scrollTo(0, y); }
  }

  function toolbar() {
    if (!ART || !CAN_WRITE) { return ""; }
    if (!EDIT) {
      return '<div class="tb"><button type="button" class="tbtn" data-a="edit">EDIT</button></div>';
    }
    return '<div class="hintbar"><b>**굵게**</b> &nbsp; <b>`코드`</b> &nbsp; '
      + '<b>%%wip:노란색%%</b> &nbsp; <b>%%pub:초록색%%</b> &nbsp; <b>&lt;br&gt;</b> 줄바꿈</div>'
      + '<div class="tb"><span class="status" id="status"></span>'
      + '<button type="button" class="tbtn" data-a="cancel">취소</button>'
      + '<button type="button" class="tbtn primary" data-a="save">저장하고 게시</button></div>';
  }

  function status(t) {
    var el = document.getElementById("status");
    if (el) { el.textContent = t || ""; }
  }

  /* ---------- 목차 따라가기 ---------- */

  var spyOff = null;
  function spy() {
    if (spyOff) { spyOff(); spyOff = null; }
    if (EDIT) { return; }

    var links = {};
    var as = Array.prototype.slice.call(document.querySelectorAll("nav.toc a"));
    as.forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
    var secs = Array.prototype.slice.call(document.querySelectorAll("section.chapter"));
    if (!secs.length) { return; }

    var ticking = false;
    function pick() {
      ticking = false;
      var probe = window.scrollY + window.innerHeight * 0.3;
      var doc = document.documentElement;
      // 맨 아래에서는 마지막 장이 이긴다. 더 스크롤할 곳이 없으면 짧은 마지막 장은
      // 판정선 위로 올라오지 못해서, 그대로 두면 하이라이트가 영영 안 넘어간다.
      var atEnd = window.innerHeight + window.scrollY >= doc.scrollHeight - 4;
      var cur = null;
      if (atEnd) {
        for (var j = secs.length - 1; j >= 0; j--) { if (!secs[j].hidden) { cur = secs[j]; break; } }
      } else {
        for (var i = 0; i < secs.length; i++) {
          if (secs[i].hidden) { continue; }
          if (secs[i].getBoundingClientRect().top + window.scrollY <= probe) { cur = secs[i]; }
          else if (cur) { break; }
        }
        if (!cur) { cur = secs[0]; }
      }
      as.forEach(function (a) { a.classList.remove("on"); });
      if (cur && links[cur.id]) { links[cur.id].classList.add("on"); }
    }
    function onScroll() {
      if (!ticking) { ticking = true; window.requestAnimationFrame(pick); }
    }

    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    spyOff = function () {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
    pick();
  }

  /* ---------- 찾기 ---------- */

  // 블록 단위로 걸러낸다. 장 제목이 걸리면 그 장은 통째로 남긴다.
  function applySearch(raw) {
    var q = String(raw || "").trim().toLowerCase();
    var hits = 0;
    Array.prototype.forEach.call(
      document.querySelectorAll(".goto, .quickstart, .partmark"),
      function (el) { el.hidden = !!q; });

    Array.prototype.forEach.call(document.querySelectorAll("section.chapter"), function (sec) {
      var h2 = sec.querySelector("h2");
      var titleHit = !!q && ((h2 && h2.textContent) || "").toLowerCase().indexOf(q) >= 0;
      var any = false;
      Array.prototype.forEach.call(sec.children, function (ch) {
        if (ch === h2 || ch.classList.contains("chapter-num") || ch.classList.contains("bc")) { return; }
        var hit = !q || titleHit || (ch.textContent || "").toLowerCase().indexOf(q) >= 0;
        ch.hidden = !hit;
        if (hit) { any = true; }
      });
      sec.hidden = !!q && !any && !titleHit;
      if (q && !sec.hidden) { hits++; }
    });

    var res = document.getElementById("qres");
    if (res) {
      res.textContent = !q ? "" : (hits ? hits + "곳" : "없음");
      res.className = "qres" + (q && !hits ? " none" : "");
    }
  }

  /* ---------- 초안 보관 (이 브라우저에만) ---------- */

  function saveDraft() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(DOC)); } catch (e) { /* 무시 */ }
  }
  function clearDraft() {
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* 무시 */ }
  }
  function readDraft() {
    try { return localStorage.getItem(DRAFT_KEY); } catch (e) { return null; }
  }

  function offerRestore() {
    var raw = readDraft();
    if (!raw || raw === JSON.stringify(DOC)) { return; }
    var bar = document.createElement("div");
    bar.className = "restore";
    bar.innerHTML = '<span>저장하지 않은 수정본이 있습니다.</span>'
      + '<button type="button" class="tbtn" data-a="restore">복원</button>'
      + '<button type="button" class="tbtn" data-a="discard">버리기</button>';
    document.body.appendChild(bar);
    bar.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) { return; }
      if (b.dataset.a === "restore") {
        try { DOC = JSON.parse(raw); } catch (err) { /* 무시 */ }
        EDIT = true; DIRTY = true; render();
      } else {
        clearDraft();
      }
      bar.remove();
    });
  }

  /* ---------- 저장(게시) ---------- */

  function buildDoc() {
    var css = document.getElementById("appstyle").textContent;
    var js = document.getElementById("appcode").textContent;
    var data = JSON.stringify(DOC, null, 1).replace(/</g, "\\u003c");
    return "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n"
      + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
      + "<title>" + esc(DOC.title) + "</title>\n" + FONTS + "\n"
      + '<style id="appstyle">' + css + "<\/style>\n</head>\n<body>\n"
      + '<div id="app"></div>\n'
      + '<script id="appdata" type="application/json">' + data + "<\/script>\n"
      + '<script id="appcode">' + js + "<\/script>\n</body>\n</html>";
  }

  function save() {
    if (!ART) { return; }
    status("저장 중…");
    ART.publish(buildDoc()).then(function () {
      DIRTY = false; clearDraft(); status("게시됨");
      // 게시에 성공하면 이 화면도 새 버전으로 다시 열린다
    }).catch(function (err) {
      var c = err && err.code;
      if (c === "conflict") {
        status("다른 곳에서 먼저 저장됨 — 새로고침됩니다");
      } else if (c === "not_writer" || c === "not_granted" || c === "consent_required") {
        CAN_WRITE = false; EDIT = false; render(true);
        alert("이 화면에서는 편집 권한이 없습니다. 읽기 전용으로 표시합니다.");
      } else if (c === "too_large") {
        status("내용이 너무 큽니다");
      } else if (c === "rate_limited") {
        status("너무 잦습니다 — 잠시 후 다시");
      } else {
        status("저장 실패 — 다시 시도해 주세요");
      }
    });
  }

  /* ---------- 이벤트 ---------- */

  document.addEventListener("input", function (e) {
    var el = e.target.closest ? e.target.closest("[data-p][contenteditable]") : null;
    if (!el || !EDIT) { return; }
    setAt(el.dataset.p, el.innerText.replace(/ /g, " "));
    DIRTY = true;
    saveDraft();
  });

  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button[data-a]") : null;
    if (!b) { return; }
    var a = b.dataset.a;

    if (a === "edit") { EDIT = true; render(true); return; }
    if (a === "save") { save(); return; }
    if (a === "cancel") {
      if (DIRTY && !confirm("저장하지 않은 수정을 버립니다. 계속할까요?")) { return; }
      clearDraft(); location.reload(); return;
    }
    if (a === "addsec") {
      DOC.sections.push({ id: "s" + Date.now(), title: "새 장", blocks: [{ t: "p", x: "" }] });
      DIRTY = true; saveDraft(); render(true); return;
    }
    if (a === "addblk") {
      getAt(b.dataset.r).push(newBlock(b.dataset.k));
      DIRTY = true; saveDraft(); render(true); return;
    }

    var arr = getAt(b.dataset.r), i = parseInt(b.dataset.i, 10);
    if (!Array.isArray(arr)) { return; }
    if (a === "del") {
      if (arr.length <= 1 && b.dataset.r.indexOf(".blocks") < 0) { return; }
      arr.splice(i, 1);
    } else if (a === "add") {
      arr.splice(i + 1, 0, blank(arr[i]));
    } else if (a === "up" && i > 0) {
      arr.splice(i - 1, 0, arr.splice(i, 1)[0]);
    } else if (a === "dn" && i < arr.length - 1) {
      arr.splice(i + 1, 0, arr.splice(i, 1)[0]);
    } else { return; }
    DIRTY = true; saveDraft(); render(true);
  });

  // 편집 중 붙여넣기는 서식 없이
  document.addEventListener("paste", function (e) {
    if (!EDIT) { return; }
    var el = e.target.closest ? e.target.closest("[data-p][contenteditable]") : null;
    if (!el) { return; }
    e.preventDefault();
    var t = (e.clipboardData || window.clipboardData).getData("text");
    document.execCommand("insertText", false, t.replace(/\r?\n/g, " "));
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "q") { applySearch(e.target.value); }
  });

  document.addEventListener("keydown", function (e) {
    if (EDIT) { return; }
    var box = document.getElementById("q");
    if (!box) { return; }
    if (e.key === "/" && document.activeElement !== box) {
      e.preventDefault(); box.focus(); box.select();
    } else if (e.key === "Escape" && box.value) {
      box.value = ""; applySearch(""); box.blur();
    }
  });

  window.addEventListener("beforeunload", function (e) {
    if (DIRTY) { e.preventDefault(); e.returnValue = ""; }
  });

  /* ---------- 시작 ---------- */

  render();

  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (ns) {
      ART = ns;
      if (ART) { render(true); offerRestore(); }
    }).catch(function () { /* 읽기 전용으로 둔다 */ });
  }
})();
</script>
</body>
</html>
